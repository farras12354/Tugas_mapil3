<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Tabungan</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
<div class="max-w-6xl mx-auto p-6">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-2xl font-bold">💰 Catatan Tabungan</h1>
    <button id="btnTrx" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">+ Transaksi</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5"><p class="text-sm text-slate-500">Total Saldo</p><p id="saldo" class="text-2xl font-bold mt-1">-</p></div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5"><p class="text-sm text-slate-500">Total Setor</p><p id="setor" class="text-2xl font-bold mt-1 text-green-600">-</p></div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5"><p class="text-sm text-slate-500">Total Tarik</p><p id="tarik" class="text-2xl font-bold mt-1 text-red-600">-</p></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-4 mt-4 items-start">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Progres Target</h2>
        <button id="btnTarget" class="px-3 py-1 rounded-lg border border-indigo-600 text-indigo-600 text-sm">+ Target</button>
      </div>
      <div id="targets"></div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5">
      <h2 class="font-semibold mb-3">Riwayat Transaksi</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-500 text-left">
            <tr class="border-b border-slate-200 dark:border-slate-700">
              <th class="py-2 pr-2 font-medium">Tanggal</th><th class="py-2 pr-2 font-medium">Jenis</th><th class="py-2 pr-2 font-medium">Kategori</th>
              <th class="py-2 pr-2 font-medium">Target</th><th class="py-2 pr-2 font-medium">Rekening</th><th class="py-2 pr-2 font-medium">Jumlah</th><th></th>
            </tr>
          </thead>
          <tbody id="riwayat"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Popup Transaksi -->
<div id="mTrx" class="modal hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 w-full max-w-md max-h-[90vh] overflow-y-auto p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">Tambah Transaksi</h2>
      <button data-close="mTrx" class="text-slate-500 hover:text-slate-800 dark:hover:text-white text-xl leading-none">✕</button>
    </div>
    <div class="flex gap-2 mb-2">
      <button type="button" id="bSetor" class="flex-1 py-2 rounded-lg text-sm font-medium">Setor</button>
      <button type="button" id="bTarik" class="flex-1 py-2 rounded-lg text-sm font-medium">Tarik</button>
    </div>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Tanggal</label>
    <input type="date" id="tanggal" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Kategori</label>
    <div class="flex gap-2">
      <select id="kategori" class="flex-1 min-w-0 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2"></select>
      <button type="button" id="addKat" class="px-3 rounded-lg border border-indigo-600 text-indigo-600 text-sm whitespace-nowrap">+ Baru</button>
    </div>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Target (opsional)</label>
    <select id="target" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2"></select>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Jumlah (Rp)</label>
    <input type="number" id="jumlah" min="1" placeholder="500000" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Sumber Rekening</label>
    <input id="rekening" placeholder="BCA / Dana / Tunai" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Catatan</label>
    <textarea id="catatan" rows="2" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2"></textarea>
    <button id="simpan" class="w-full mt-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">Simpan Transaksi</button>
  </div>
</div>

<!-- Popup Target -->
<div id="mTarget" class="modal hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 w-full max-w-md p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">Tambah Target</h2>
      <button data-close="mTarget" class="text-slate-500 hover:text-slate-800 dark:hover:text-white text-xl leading-none">✕</button>
    </div>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Nama target</label>
    <input id="tNama" placeholder="Beli Laptop" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Target dana (Rp)</label>
    <input id="tDana" type="number" min="1" placeholder="15000000" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <button id="tSimpan" class="w-full mt-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">Tambah Target</button>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
