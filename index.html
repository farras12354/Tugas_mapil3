<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Tabungan</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
<div class="max-w-6xl mx-auto p-6">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-2xl font-bold">💰 Catatan Tabungan</h1>
    <button id="btnTrx" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">+ Transaksi</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5"><p class="text-sm text-slate-500">Total Saldo</p><p id="saldo" class="text-2xl font-bold mt-1">-</p></div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5"><p class="text-sm text-slate-500">Total Setor</p><p id="setor" class="text-2xl font-bold mt-1 text-green-600">-</p></div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5"><p class="text-sm text-slate-500">Total Tarik</p><p id="tarik" class="text-2xl font-bold mt-1 text-red-600">-</p></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-4 mt-4 items-start">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Progres Target</h2>
        <button id="btnTarget" class="px-3 py-1 rounded-lg border border-indigo-600 text-indigo-600 text-sm">+ Target</button>
      </div>
      <div id="targets"></div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5">
      <h2 class="font-semibold mb-3">Riwayat Transaksi</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-500 text-left">
            <tr class="border-b border-slate-200 dark:border-slate-700">
              <th class="py-2 pr-2 font-medium">Tanggal</th><th class="py-2 pr-2 font-medium">Jenis</th><th class="py-2 pr-2 font-medium">Kategori</th>
              <th class="py-2 pr-2 font-medium">Target</th><th class="py-2 pr-2 font-medium">Rekening</th><th class="py-2 pr-2 font-medium">Jumlah</th><th></th>
            </tr>
          </thead>
          <tbody id="riwayat"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Popup Transaksi -->
<div id="mTrx" class="modal hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 w-full max-w-md max-h-[90vh] overflow-y-auto p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">Tambah Transaksi</h2>
      <button data-close="mTrx" class="text-slate-500 hover:text-slate-800 dark:hover:text-white text-xl leading-none">✕</button>
    </div>
    <div class="flex gap-2 mb-2">
      <button type="button" id="bSetor" class="flex-1 py-2 rounded-lg text-sm font-medium">Setor</button>
      <button type="button" id="bTarik" class="flex-1 py-2 rounded-lg text-sm font-medium">Tarik</button>
    </div>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Tanggal</label>
    <input type="date" id="tanggal" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Kategori</label>
    <div class="flex gap-2">
      <select id="kategori" class="flex-1 min-w-0 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2"></select>
      <button type="button" id="addKat" class="px-3 rounded-lg border border-indigo-600 text-indigo-600 text-sm whitespace-nowrap">+ Baru</button>
    </div>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Target (opsional)</label>
    <select id="target" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2"></select>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Jumlah (Rp)</label>
    <input type="number" id="jumlah" min="1" placeholder="500000" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Sumber Rekening</label>
    <input id="rekening" placeholder="BCA / Dana / Tunai" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Catatan</label>
    <textarea id="catatan" rows="2" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2"></textarea>
    <button id="simpan" class="w-full mt-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">Simpan Transaksi</button>
  </div>
</div>

<!-- Popup Target -->
<div id="mTarget" class="modal hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 w-full max-w-md p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">Tambah Target</h2>
      <button data-close="mTarget" class="text-slate-500 hover:text-slate-800 dark:hover:text-white text-xl leading-none">✕</button>
    </div>
    <label class="block text-sm text-slate-500 mt-3 mb-1">Nama target</label>
    <input id="tNama" placeholder="Beli Laptop" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <label class="block text-sm text-slate-500 mt-3 mb-1">Target dana (Rp)</label>
    <input id="tDana" type="number" min="1" placeholder="15000000" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-2">
    <button id="tSimpan" class="w-full mt-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium">Tambah Target</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// ── Format Rupiah ─────────────────────────────────────────────────────────────
const rp = (n) => 'Rp ' + Number(n).toLocaleString('id-ID');

// ── Modal helpers ─────────────────────────────────────────────────────────────
function openModal(id) {
  const m = $(id);
  m.classList.remove('hidden');
  m.style.display = 'flex';
}
function closeModal(id) {
  const m = $(id);
  m.classList.add('hidden');
  m.style.display = 'none';
}
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.onclick = () => closeModal(btn.dataset.close);
});

// ── State ─────────────────────────────────────────────────────────────────────
let jenisTrx = 'setor';
let kategoriList = [];
let targetList = [];

// ── Load Ringkasan ─────────────────────────────────────────────────────────────
async function loadRingkasan() {
  try {
    const r = await fetch('/api/ringkasan');
    const d = await r.json();
    $('saldo').textContent = rp(d.saldo);
    $('setor').textContent = rp(d.total_setor);
    $('tarik').textContent = rp(d.total_tarik);
  } catch (e) { console.error('ringkasan:', e); }
}

// ── Load Transaksi ─────────────────────────────────────────────────────────────
async function loadTransaksi() {
  try {
    const r = await fetch('/api/transaksi');
    const data = await r.json();
    const tbody = $('riwayat');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400">Belum ada transaksi</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(t => `
      <tr class="border-b border-slate-100 dark:border-slate-700">
        <td class="py-2 pr-2">${t.tanggal}</td>
        <td class="py-2 pr-2">
          <span class="px-2 py-0.5 rounded text-xs font-medium ${t.jenis === 'setor' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
            ${t.jenis}
          </span>
        </td>
        <td class="py-2 pr-2">${t.nama_kategori || '-'}</td>
        <td class="py-2 pr-2">${t.nama_target || '-'}</td>
        <td class="py-2 pr-2">${t.sumber_rekening || '-'}</td>
        <td class="py-2 pr-2 font-medium">${rp(t.jumlah)}</td>
        <td class="py-2">
          <button onclick="hapusTrx(${t.id_transaksi})" class="text-red-400 hover:text-red-600 text-xs">Hapus</button>
        </td>
      </tr>
    `).join('');
  } catch (e) { console.error('transaksi:', e); }
}

// ── Load Target ───────────────────────────────────────────────────────────────
async function loadTarget() {
  try {
    const r = await fetch('/api/target');
    targetList = await r.json();
    const container = $('targets');
    if (!targetList.length) {
      container.innerHTML = '<p class="text-slate-400 text-sm">Belum ada target</p>';
    } else {
      container.innerHTML = targetList.map(t => {
        const pct = Math.min(100, Math.round((t.terkumpul / t.target_dana) * 100));
        return `
          <div class="mb-4">
            <div class="flex justify-between text-sm mb-1">
              <span class="font-medium">${t.nama_target}</span>
              <button onclick="hapusTarget(${t.id_target})" class="text-red-400 hover:text-red-600 text-xs">Hapus</button>
            </div>
            <div class="flex justify-between text-xs text-slate-500 mb-1">
              <span>${rp(t.terkumpul)}</span><span>${rp(t.target_dana)}</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
              <div class="bg-indigo-500 h-2 rounded-full" style="width:${pct}%"></div>
            </div>
            <p class="text-xs text-slate-400 mt-1 text-right">${pct}%</p>
          </div>
        `;
      }).join('');
    }
    // Update dropdown target di modal transaksi
    const sel = $('target');
    sel.innerHTML = '<option value="">-- Tanpa Target --</option>' +
      targetList.map(t => `<option value="${t.id_target}">${t.nama_target}</option>`).join('');
  } catch (e) { console.error('target:', e); }
}

// ── Load Kategori ─────────────────────────────────────────────────────────────
async function loadKategori() {
  try {
    const r = await fetch('/api/kategori');
    kategoriList = await r.json();
    const sel = $('kategori');
    sel.innerHTML = kategoriList.map(k =>
      `<option value="${k.id_kategori}">${k.nama_kategori}</option>`
    ).join('');
  } catch (e) { console.error('kategori:', e); }
}

// ── Hapus Transaksi ───────────────────────────────────────────────────────────
async function hapusTrx(id) {
  if (!confirm('Hapus transaksi ini?')) return;
  await fetch('/api/transaksi/' + id, { method: 'DELETE' });
  loadAll();
}

// ── Hapus Target ──────────────────────────────────────────────────────────────
async function hapusTarget(id) {
  if (!confirm('Hapus target ini?')) return;
  await fetch('/api/target/' + id, { method: 'DELETE' });
  loadTarget();
}

// ── Load All ──────────────────────────────────────────────────────────────────
function loadAll() {
  loadRingkasan();
  loadTransaksi();
  loadTarget();
  loadKategori();
}

// ── Button + Transaksi ────────────────────────────────────────────────────────
$('btnTrx').onclick = () => {
  $('tanggal').value = new Date().toISOString().slice(0, 10);
  setJenis('setor');
  openModal('mTrx');
};

// ── Jenis Setor / Tarik ───────────────────────────────────────────────────────
function setJenis(j) {
  jenisTrx = j;
  $('bSetor').className = 'flex-1 py-2 rounded-lg text-sm font-medium ' +
    (j === 'setor' ? 'bg-green-500 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300');
  $('bTarik').className = 'flex-1 py-2 rounded-lg text-sm font-medium ' +
    (j === 'Tarik' ? 'bg-red-500 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300');
}
$('bSetor').onclick = () => setJenis('setor');
$('bTarik').onclick = () => setJenis('Tarik');

// ── Tambah Kategori Baru ──────────────────────────────────────────────────────
$('addKat').onclick = async () => {
  const nama = prompt('Nama kategori baru:');
  if (!nama) return;
  const r = await fetch('/api/kategori', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nama_kategori: nama })
  });
  if (r.ok) await loadKategori();
};

// ── Simpan Transaksi ──────────────────────────────────────────────────────────
$('simpan').onclick = async () => {
  const tanggal = $('tanggal').value;
  const id_kategori = $('kategori').value;
  const id_target = $('target').value || null;
  const jumlah = $('jumlah').value;
  const sumber_rekening = $('rekening').value;
  const catatan = $('catatan').value;

  if (!tanggal || !id_kategori || !jumlah) {
    alert('Tanggal, kategori, dan jumlah wajib diisi!');
    return;
  }

  const r = await fetch('/api/transaksi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tanggal, jenis: jenisTrx, id_kategori, id_target, jumlah, sumber_rekening, catatan })
  });
  if (r.ok) {
    closeModal('mTrx');
    $('jumlah').value = '';
    $('rekening').value = '';
    $('catatan').value = '';
    loadAll();
  } else {
    const d = await r.json();
    alert(d.error || 'Gagal menyimpan transaksi');
  }
};

// ── Button + Target ───────────────────────────────────────────────────────────
$('btnTarget').onclick = () => openModal('mTarget');

$('tSimpan').onclick = async () => {
  const nama_target = $('tNama').value.trim();
  const target_dana = $('tDana').value;
  if (!nama_target || !target_dana) {
    alert('Nama target dan dana wajib diisi!');
    return;
  }
  const r = await fetch('/api/target', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nama_target, target_dana })
  });
  if (r.ok) {
    closeModal('mTarget');
    $('tNama').value = '';
    $('tDana').value = '';
    loadTarget();
  } else {
    const d = await r.json();
    alert(d.error || 'Gagal menyimpan target');
  }
};

// ── Init ──────────────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
